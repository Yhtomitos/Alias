[workspace]
members = [
    "crates/crypto-core",
    "crates/vault-core",
    "crates/identity-graph",
    "crates/agent-core",
]
resolver = "2"

[workspace.dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
